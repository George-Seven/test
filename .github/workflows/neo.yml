name: Build NEO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Termux packages
        run: |
          git clone --depth 1 https://github.com/termux/termux-packages
          cd termux-packages

          mkdir -p x11-packages/neo

          cat > x11-packages/neo/build.sh <<'EOF'
          TERMUX_PKG_HOMEPAGE=https://github.com/hughhowey/neo
          TERMUX_PKG_DESCRIPTION="A novel-writing tool created by a novelist."
          TERMUX_PKG_LICENSE="MIT"
          TERMUX_PKG_MAINTAINER="@George-Seven"
          TERMUX_PKG_VERSION=0.8.3
          TERMUX_PKG_SRCURL=https://github.com/hughhowey/neo/archive/refs/tags/v${TERMUX_PKG_VERSION}.tar.gz
          TERMUX_PKG_DEPENDS="openbox"
          TERMUX_PKG_BUILD_DEPENDS="nodejs, npm"
          TERMUX_PKG_BUILD_IN_SRC=true
          TERMUX_PKG_PLATFORM_INDEPENDENT=true

          termux_step_pre_configure() {
              :
          }

          termux_step_make_install() {
              local neo_dir="$TERMUX_PREFIX/share/neo"

              mkdir -p "$neo_dir"

              cp -a . "$neo_dir/"

              rm -rf \
                  "$neo_dir/.git" \
                  "$neo_dir/.github" \
                  "$neo_dir/dist" \
                  "$neo_dir/Backups"

              termux_setup_nodejs

              cd "$neo_dir"

              npm install \
                  --omit=dev \
                  --ignore-scripts

              rm -rf "$neo_dir/node_modules/electron"
              rm -rf "$neo_dir/.npm"

              install -Dm755 /dev/stdin "$neo_dir/install-electron.sh" <<-'INSTALL_ELECTRON'
          #!/data/data/com.termux/files/usr/bin/bash

          set -e

          PREFIX="${PREFIX:-/data/data/com.termux/files/usr}"

          echo "==> Electron was not found."
          echo "==> Enabling TUR repository..."

          apt update
          apt install -y tur-repo

          echo "==> Installing Electron..."

          apt install -y electron

          echo "==> Electron installation complete."
          INSTALL_ELECTRON

              install -Dm755 /dev/stdin "$neo_dir/install-termux-x11.sh" <<-'INSTALL_X11'
          #!/data/data/com.termux/files/usr/bin/bash

          set -e

          PREFIX="${PREFIX:-/data/data/com.termux/files/usr}"

          echo "==> termux-x11 was not found."
          echo "==> Enabling X11 repository..."

          apt update
          apt install -y x11-repo

          apt install -y curl jq

          echo "==> Finding latest Termux:X11 nightly..."

          TMPDIR="$(mktemp -d)"
          trap 'rm -rf "$TMPDIR"' EXIT

          TERMUX_X11_URL="$(
              curl -fsSL \
                  "https://api.github.com/repos/termux/termux-x11/releases/tags/nightly" |
                  jq -r '
                      .assets[]
                      | select(.name | endswith(".deb"))
                      | .browser_download_url
                  ' |
                  head -n 1
          )"

          if [ -z "$TERMUX_X11_URL" ] || [ "$TERMUX_X11_URL" = "null" ]; then
              echo "Error: unable to find the Termux:X11 nightly package." >&2
              exit 1
          fi

          echo "==> Downloading Termux:X11..."

          curl -fsSL "$TERMUX_X11_URL" \
              -o "$TMPDIR/termux-x11.deb"

          echo "==> Installing Termux:X11..."

          apt install -y "$TMPDIR/termux-x11.deb"

          rm -f "$TMPDIR/termux-x11.deb"

          echo "==> Termux:X11 installation complete."
          INSTALL_X11

              install -Dm755 /dev/stdin "$TERMUX_PREFIX/bin/neo" <<-'LAUNCHER'
          #!/data/data/com.termux/files/usr/bin/bash

          set -e

          PREFIX="${PREFIX:-/data/data/com.termux/files/usr}"
          NEO_DIR="$PREFIX/share/neo"

          ELECTRON=""

          if command -v electron >/dev/null 2>&1; then
              ELECTRON="$(command -v electron)"
          fi

          if [ -z "$ELECTRON" ]; then
              for i in "$PREFIX"/lib/electron*/electron; do
                  if [ -x "$i" ]; then
                      ELECTRON="$i"
                      break
                  fi
              done
          fi

          if [ -z "$ELECTRON" ]; then
              "$NEO_DIR/install-electron.sh"

              if command -v electron >/dev/null 2>&1; then
                  ELECTRON="$(command -v electron)"
              fi

              if [ -z "$ELECTRON" ]; then
                  for i in "$PREFIX"/lib/electron*/electron; do
                      if [ -x "$i" ]; then
                          ELECTRON="$i"
                          break
                      fi
                  done
              fi
          fi

          if [ -z "$ELECTRON" ]; then
              echo "Error: Electron executable not found after installation." >&2
              exit 1
          fi

          export LIBGL_ALWAYS_SOFTWARE=1

          unset MESA_LOADER_DRIVER_OVERRIDE
          unset TU_DEBUG
          unset VK_DRIVER_FILES
          unset VK_ICD_FILENAMES
          unset MESA_VK_WSI_PRESENT_MODE

          exec "$ELECTRON" \
              --fullscreen \
              --disable-gpu \
              "$NEO_DIR" \
              "$@"
          LAUNCHER

              install -Dm755 /dev/stdin "$TERMUX_PREFIX/bin/neoX" <<-'LAUNCHER_X11'
          #!/data/data/com.termux/files/usr/bin/bash

          set -e

          PREFIX="${PREFIX:-/data/data/com.termux/files/usr}"
          NEO_DIR="$PREFIX/share/neo"

          if ! command -v termux-x11 >/dev/null 2>&1; then
              "$NEO_DIR/install-termux-x11.sh"
          fi

          if ! command -v termux-x11 >/dev/null 2>&1; then
              echo "Error: termux-x11 executable not found after installation." >&2
              exit 1
          fi

          exec termux-x11 -xstartup "openbox --startup neo"
          LAUNCHER_X11
          }
          EOF

      - name: Build package
        working-directory: termux-packages
        run: |
          chmod +x scripts/run-docker.sh
          ./scripts/run-docker.sh ./build-package.sh -I -f neo

      - name: Prepare release
        working-directory: termux-packages
        run: |
          set -e

          mkdir -p release

          DEB="$(find output -type f -name '*.deb' -print -quit)"

          if [ -z "$DEB" ]; then
            echo "Error: no .deb package was produced."
            exit 1
          fi

          echo "Built package: $DEB"

          cp "$DEB" release/neo.deb

          echo "=== Release files ==="
          ls -lh release/neo.deb

      - name: Create/update neo release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neo
          name: NEO
          body: |
            # NEO for Termux

            NEO is a novel-writing tool.

            ## Installation

            ```sh
            curl -LO https://github.com/${{ github.repository }}/releases/download/neo/neo.deb && \
            apt install ./neo.deb
            ```

            Then launch:

            ```sh
            neo
            ```

            Or for Termux:X11 (recommended):

            ```sh
            neoX
            ```

            ## Package

            - `neo.deb`
            - Version: 0.8.3
          files: |
            termux-packages/release/neo.deb
          draft: false
          prerelease: false
          make_latest: false
