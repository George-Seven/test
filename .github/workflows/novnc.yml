name: Run NoVNC
on:
  workflow_dispatch:

jobs:
  novnc:
    runs-on: ubuntu-24.04

    steps:
      - name: Clean Docker
        run: |
          sudo systemctl stop docker.service || true
          sudo systemctl stop docker.socket || true
          sudo rm -rf /var/lib/docker
          sudo mkdir -p /var/lib/docker
          sudo systemctl start docker.service

      - name: Maximize runner disk
        uses: justinthelaw/maximize-github-runner-space@v0.6.2
        with:
          cleanup-profile: max

      - name: Install Dependencies
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
          | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com bookworm main" \
          | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update
          sudo apt install -y ngrok xfce4 xfce4-goodies dbus-x11 tigervnc-standalone-server
          sudo snap install novnc

      - name: Run NoVNC
        run: |
          mkdir -p "$HOME/.vnc"
          echo "${{ secrets.VNC_PASSWORD }}" | vncpasswd -f > "$HOME/.vnc/passwd"
          chmod 600 "$HOME/.vnc/passwd"
          ngrok config add-authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"
          vncserver -localhost no :1
          novnc --vnc localhost:5901 &>/dev/null &
          ngrok http 6080 &>/dev/null &
          sleep infinity
